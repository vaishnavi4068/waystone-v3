# Read-only dashboard frontend (Next.js). Stateless — its own Deployment + Service.
# Replace __FRONTEND_IMAGE__ with your pushed frontend image. The image is built with
# NEXT_PUBLIC_API_BASE baked in (see DEPLOY.md) so the browser calls the public /api/* path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waystone-frontend
  namespace: waystone-arena
  labels: { app: waystone-frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: waystone-frontend }
  template:
    metadata:
      labels: { app: waystone-frontend }
    spec:
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: waystone-frontend
  namespace: waystone-arena
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector: { app: waystone-frontend }
  ports:
    - port: 80
      targetPort: 3000
