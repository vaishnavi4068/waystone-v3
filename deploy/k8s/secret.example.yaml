# Do NOT commit real secrets. PRODUCTION path is GCP Secret Manager via the CSI driver
# (see secret-provider.yaml) — these keys are synced into this same `waystone-arena-secrets`
# Secret, so the app reads identical env vars either way.
#
# For a quick/dev cluster you can instead create the Secret imperatively:
#
#   kubectl -n waystone-arena create secret generic waystone-arena-secrets \
#     --from-literal=POLYGON_API_KEY="..." \
#     --from-literal=ALPACA_API_KEY="..." \
#     --from-literal=ALPACA_API_SECRET="..." \
#     --from-literal=ALPACA_PAPER="true" \
#     --from-literal=ZOHO_CLIQ_WEBHOOK_URL="..." \
#     --from-literal=WHATSAPP_GROUP_API_URL="..." \
#     --from-literal=WHATSAPP_GROUP_API_TOKEN="..." \
#     --from-literal=WHATSAPP_GROUP_ID="...@g.us" \
#     --from-literal=ANTHROPIC_API_KEY="..." \
#     --from-literal=WAYSTONE_ADMIN_TOKEN="$(openssl rand -hex 24)"
#
# This file documents the expected keys only.
apiVersion: v1
kind: Secret
metadata:
  name: waystone-arena-secrets
  namespace: waystone-arena
type: Opaque
stringData:
  POLYGON_API_KEY: "REPLACE_ME"          # bars + news
  # ── shared Alpaca PAPER account (real execution; read by AlpacaSettings, env_prefix ALPACA_)
  ALPACA_API_KEY: "REPLACE_ME"
  ALPACA_API_SECRET: "REPLACE_ME"
  ALPACA_PAPER: "true"                   # keep true — live trading is a deliberate later step
  # ── messaging: Zoho Cliq (team group) — read by ZohoCliqChannel
  ZOHO_CLIQ_WEBHOOK_URL: "REPLACE_ME"    # channel Incoming-Webhook URL (zapikey embedded)
  # ── messaging: WhatsApp group via gateway (green-api / WAHA / Whapi) — WhatsAppGroupChannel
  WHATSAPP_GROUP_API_URL: "REPLACE_ME"   # gateway send-message endpoint
  WHATSAPP_GROUP_API_TOKEN: "REPLACE_ME" # gateway bearer token
  WHATSAPP_GROUP_ID: "REPLACE_ME"        # target group id/JID, e.g. 12036000@g.us
  # ── optional / ops
  ANTHROPIC_API_KEY: "REPLACE_ME"        # optional: sentiment scorer / Claude agents
  WAYSTONE_ADMIN_TOKEN: "REPLACE_ME"     # organizer token to add team members
