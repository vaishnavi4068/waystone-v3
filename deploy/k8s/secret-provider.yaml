# Option A — native Secret Manager access via the Secrets Store CSI driver.
#
# Mounts the infra secrets from GCP Secret Manager and SYNCS them into the
# `waystone-arena-secrets` Kubernetes Secret that arena.yaml already `envFrom`s — so the app
# keeps reading plain env vars while Secret Manager stays the source of truth.
#
# Covers: data (polygon), the shared ALPACA PAPER account, the messaging channels
# (Zoho Cliq + WhatsApp-group gateway), Claude, and the organizer admin token.
#
# Create the GCP secrets first (one-time), e.g.:
#   printf '%s' "<value>" | gcloud secrets create alpaca-api-key       --data-file=-
#   printf '%s' "<value>" | gcloud secrets create alpaca-api-secret    --data-file=-
#   printf '%s' "<value>" | gcloud secrets create zoho-cliq-webhook    --data-file=-
#   printf '%s' "<value>" | gcloud secrets create whatsapp-group-api-url   --data-file=-
#   printf '%s' "<value>" | gcloud secrets create whatsapp-group-api-token --data-file=-
#   printf '%s' "<value>" | gcloud secrets create whatsapp-group-id        --data-file=-
#
# Prereqs (see DEPLOY.md Step 3):
#   - GKE Secret Manager add-on / Secrets Store CSI driver enabled on the cluster
#   - Workload Identity on (default in Autopilot)
#   - The Kubernetes SA `waystone-arena` granted roles/secretmanager.secretAccessor on each secret, e.g.:
#       for S in polygon-api-key alpaca-api-key alpaca-api-secret zoho-cliq-webhook \
#                whatsapp-group-api-url whatsapp-group-api-token whatsapp-group-id \
#                anthropic-api-key waystone-admin-token; do
#         gcloud secrets add-iam-policy-binding "$S" \
#           --member="principal://iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/PROJECT_ID.svc.id.goog/subject/ns/waystone-arena/sa/waystone-arena" \
#           --role="roles/secretmanager.secretAccessor"
#       done
apiVersion: v1
kind: ServiceAccount
metadata:
  name: waystone-arena
  namespace: waystone-arena
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: waystone-arena-sm
  namespace: waystone-arena
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/polygon-api-key/versions/latest"
        path: "polygon-api-key"
      - resourceName: "projects/PROJECT_ID/secrets/alpaca-api-key/versions/latest"
        path: "alpaca-api-key"
      - resourceName: "projects/PROJECT_ID/secrets/alpaca-api-secret/versions/latest"
        path: "alpaca-api-secret"
      - resourceName: "projects/PROJECT_ID/secrets/zoho-cliq-webhook/versions/latest"
        path: "zoho-cliq-webhook"
      - resourceName: "projects/PROJECT_ID/secrets/whatsapp-group-api-url/versions/latest"
        path: "whatsapp-group-api-url"
      - resourceName: "projects/PROJECT_ID/secrets/whatsapp-group-api-token/versions/latest"
        path: "whatsapp-group-api-token"
      - resourceName: "projects/PROJECT_ID/secrets/whatsapp-group-id/versions/latest"
        path: "whatsapp-group-id"
      - resourceName: "projects/PROJECT_ID/secrets/anthropic-api-key/versions/latest"
        path: "anthropic-api-key"
      - resourceName: "projects/PROJECT_ID/secrets/waystone-admin-token/versions/latest"
        path: "waystone-admin-token"
  # Sync the mounted files into the env-var Secret the Deployment consumes. The `key` names
  # match what the app reads: AlpacaSettings (env_prefix ALPACA_), ZohoCliqChannel
  # (ZOHO_CLIQ_WEBHOOK_URL), WhatsAppGroupChannel (WHATSAPP_GROUP_*).
  secretObjects:
    - secretName: waystone-arena-secrets
      type: Opaque
      data:
        - objectName: "polygon-api-key"
          key: POLYGON_API_KEY
        - objectName: "alpaca-api-key"
          key: ALPACA_API_KEY
        - objectName: "alpaca-api-secret"
          key: ALPACA_API_SECRET
        - objectName: "zoho-cliq-webhook"
          key: ZOHO_CLIQ_WEBHOOK_URL
        - objectName: "whatsapp-group-api-url"
          key: WHATSAPP_GROUP_API_URL
        - objectName: "whatsapp-group-api-token"
          key: WHATSAPP_GROUP_API_TOKEN
        - objectName: "whatsapp-group-id"
          key: WHATSAPP_GROUP_ID
        - objectName: "anthropic-api-key"
          key: ANTHROPIC_API_KEY
        - objectName: "waystone-admin-token"
          key: WAYSTONE_ADMIN_TOKEN
#
# Then patch the Deployment in arena.yaml so the CSI volume is mounted (required to trigger
# the sync). Add under spec.template.spec:
#
#   serviceAccountName: waystone-arena
#   containers:
#     - name: arena
#       volumeMounts:
#         - name: sm
#           mountPath: /mnt/secrets
#           readOnly: true
#   volumes:
#     - name: sm
#       csi:
#         driver: secrets-store.csi.x-k8s.io
#         readOnly: true
#         volumeAttributes:
#           secretProviderClass: waystone-arena-sm
