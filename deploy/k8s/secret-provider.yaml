# Option A — native Secret Manager access via the Secrets Store CSI driver.
#
# Mounts the three infra secrets from GCP Secret Manager and SYNCS them into the
# `waystone-arena-secrets` Kubernetes Secret that arena.yaml already `envFrom`s — so the app
# keeps reading plain env vars while Secret Manager stays the source of truth.
#
# Prereqs (see DEPLOY.md Step 3):
#   - GKE Secret Manager add-on / Secrets Store CSI driver enabled on the cluster
#   - Workload Identity on (default in Autopilot)
#   - The Kubernetes SA `waystone-arena` granted roles/secretmanager.secretAccessor on each secret
apiVersion: v1
kind: ServiceAccount
metadata:
  name: waystone-arena
  namespace: waystone-arena
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: waystone-arena-sm
  namespace: waystone-arena
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/polygon-api-key/versions/latest"
        path: "polygon-api-key"
      - resourceName: "projects/PROJECT_ID/secrets/anthropic-api-key/versions/latest"
        path: "anthropic-api-key"
      - resourceName: "projects/PROJECT_ID/secrets/waystone-admin-token/versions/latest"
        path: "waystone-admin-token"
  # Sync the mounted files into the env-var Secret the Deployment consumes.
  secretObjects:
    - secretName: waystone-arena-secrets
      type: Opaque
      data:
        - objectName: "polygon-api-key"
          key: POLYGON_API_KEY
        - objectName: "anthropic-api-key"
          key: ANTHROPIC_API_KEY
        - objectName: "waystone-admin-token"
          key: WAYSTONE_ADMIN_TOKEN
