# Builds the sentiment job image. Run from the repo root:
#   gcloud builds submit --config deploy/sentiment/cloudbuild.yaml --substitutions=_IMAGE=<registry/image:tag> .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/sentiment/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
substitutions:
  _IMAGE: ""
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
