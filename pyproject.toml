[project]
name = "waystone3"
version = "0.1.0"
description = "Nimble technical-momentum trading platform (greenfield rebuild)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "yfinance>=0.2.40",
    "python-dotenv>=1.0",
    "anthropic[vertex]>=0.69",
    "httpx>=0.27",
    "mcp>=1.2",
    "uvicorn>=0.30",
    "fastapi>=0.110",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.21"]

[project.scripts]
waystone3 = "waystone3.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waystone3"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PIE", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Typer's idiomatic option/argument defaults are function calls by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "alpaca.*"]
ignore_missing_imports = true

# Thin third-party adapters verified against their live SDKs, not the type checker:
# the Alpaca SDK returns loose union types, and the Anthropic call site wraps the SDK's
# evolving structured-output surface. Both are exercised by integration, not mypy.
[[tool.mypy.overrides]]
module = [
    "waystone3.brokers.alpaca",
    "waystone3.agents.claude",
    "waystone3.signals.sentiment_scorer",
    "waystone3.mcp_server",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
